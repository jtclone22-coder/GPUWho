[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuwho"
version = "0.1.0"
description = "Which program is using which GPU, and how much VRAM. Any vendor, read-only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
gpuwho = "gpuwho.cli:main"

[tool.setuptools]
packages = ["gpuwho"]
